<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off the Trail — The Trailprint Atlas</title>
    <meta name="robots" content="noindex">
    <!-- Self-contained on purpose: GitHub Pages serves this page from any URL
         depth, where relative paths to css/js/assets would break. -->
    <link rel="icon" href="https://hiker-dan.github.io/trailprint-atlas/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="https://hiker-dan.github.io/trailprint-atlas/assets/favicon-32.png" type="image/png" sizes="32x32">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .lost {
            padding: 40px 24px;
        }
        .mark {
            width: 96px;
            height: 96px;
            margin: 0 auto 10px auto;
        }
        h1 {
            font-size: 2.4em;
            color: #2c3e50;
            margin: 0 0 12px 0;
        }
        p {
            font-size: 1.15em;
            color: #666;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #4a7c59;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .btn:hover {
            background-color: #3b6347;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="lost">
        <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Trailprint Atlas mark">
            <rect width="64" height="64" rx="14" fill="#4a7c59"/>
            <circle cx="19" cy="17" r="6" fill="#f1c40f"/>
            <path d="M6 50 L24 24 L33 36 L42 18 L58 50 Z" fill="#fdfdfd"/>
        </svg>
        <h1>404 — Off the Trail</h1>
        <p>This path doesn't exist, or hasn't been hiked yet.</p>
        <a class="btn" href="https://hiker-dan.github.io/trailprint-atlas/">Back to the Trailhead</a>
    </div>
</body>
</html>
