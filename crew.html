<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Crew - The Trailprint Atlas</title>
    <meta name="description" content="The Muster Roll of the Trailprint Atlas — everyone who has shared the trail, in the order they first signed, with the outings, miles and seasons walked together.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Trailprint Atlas">
    <meta property="og:title" content="Trail Crew — The Trailprint Atlas">
    <meta property="og:description" content="The Muster Roll — everyone who has shared the trail, in the order they first signed.">
    <meta property="og:url" content="https://hiker-dan.github.io/trailprint-atlas/crew.html">
    <meta property="og:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_68-seal-lion-point-to-hidden-beach-loop-02">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trail Crew — The Trailprint Atlas">
    <meta name="twitter:description" content="The Muster Roll — everyone who has shared the trail, in the order they first signed.">
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/crew.css"/>
</head>
<body>
    <!-- Shared nav: structure injected by scripts/nav.js (one copy for all pages) -->
    <nav id="top-bar-container"></nav>
    <script src="scripts/nav.js"></script>

    <!-- THE MUSTER ROLL — a muster roll IS a register: a bound book listing
         everyone present, with the date each one signed and the seasons they
         served. Left leaf is the cover, right leaf is the roll. A person is
         not a separate page; they are a page IN it, reached by turning. -->
    <div class="crew-book crew-roll">

        <!-- the front cover -->
        <div class="leaf l">
            <div class="inner">
                <div class="bk-kick">The Trailprint Atlas &middot; Vol. I</div>
                <h1 class="bk-title">The Muster<br>Roll</h1>
                <div class="bk-rule"></div>
                <p class="bk-sub">Everyone who has shared the trail, entered in the order they first signed. Each mark is one outing, inked in its own year. Hover a line to see who else was there.</p>

                <div class="tally" id="crew-tally"></div>

                <div class="tuck">
                    <div class="cap">Photographs tucked inside the cover</div>
                    <div class="strip" id="crew-strip"></div>
                </div>

                <div class="foot-l">
                    <div class="bk-key" id="crew-key"></div>
                    <div class="closing" id="crew-closing"></div>
                </div>
            </div>
        </div>

        <div class="gutter"></div>

        <!-- the roll -->
        <div class="leaf r">
            <div class="inner">
                <div class="r-head">
                    <span class="t">The Register of Company</span>
                    <div class="order">
                        <span>Order</span>
                        <button type="button" data-sort="signed" class="on">Signed</button>
                        <button type="button" data-sort="outings">Outings</button>
                    </div>
                </div>
                <div class="roll" id="crew-roll"></div>
            </div>
        </div>
    </div>

    <!-- Shared Atlas config + data layer (must load before other Atlas scripts) -->
    <script src="scripts/config.js"></script>
    <script src="scripts/atlas-data.js"></script>
    <!-- The page turn: the gesture shared with crew-member.html -->
    <script src="scripts/crew-book.js"></script>
    <!-- This page's script -->
    <script src="scripts/crew.js"></script>
    <!-- Shared script: active-page highlight (+ the credits slideshow) -->
    <script src="scripts/nav-updater.js"></script>
</body>
</html>
