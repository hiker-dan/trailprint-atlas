<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hike Details - The Trailprint Atlas</title>
    <meta name="description" content="The logbook of the Trailprint Atlas — each hike's route, photos, trail notes, and that day's weather almanac.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- Link preview cards (Open Graph + Twitter). Per-hike previews arrive in Phase 2. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Trailprint Atlas">
    <meta property="og:title" content="Logbook — The Trailprint Atlas">
    <meta property="og:description" content="The logbook of the Trailprint Atlas — each hike's route, photos, trail notes, and that day's weather almanac.">
    <meta property="og:url" content="https://hiker-dan.github.io/trailprint-atlas/hike.html">
    <meta property="og:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_68-seal-lion-point-to-hidden-beach-loop-02">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Logbook — The Trailprint Atlas">
    <meta name="twitter:description" content="The logbook of the Trailprint Atlas — each hike's route, photos, trail notes, and that day's weather almanac.">
    <meta name="twitter:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_68-seal-lion-point-to-hidden-beach-loop-02">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/hike.css"/>
</head>
<body>
    <!-- Shared nav: structure injected by scripts/nav.js (one copy for all pages) -->
    <nav id="top-bar-container"></nav>
    <script src="scripts/nav.js"></script>

    <!-- The timeline strip is gone (The Continuous Expedition, July 2026):
         time-navigation lives in exactly one place now — the map. This page
         is a destination; its doors back to the land are in the collar and
         the return chip below. -->

    <!-- ===================== THE LIGHT TABLE =====================
         One desk seen from above: the slides at left, the map sheet at
         centre (with the elevation acetate bolted beneath it), and the
         day's paperwork at right. -->
    <main class="light-table" id="light-table">
        <div class="desk">

            <!-- The slides: this is the one place on the Atlas with true
                 photo interaction, so they get a column and a lightbox. -->
            <aside class="slides" id="slides-col">
                <div class="slides-k">
                    <span>The Slides</span><span class="n" id="slides-count"></span>
                </div>
                <div class="slide-strip" id="slide-strip"></div>
            </aside>

            <!-- The sheet -->
            <div class="sheet-col">
                <div class="sheet" id="sheet">
                    <div class="tabs" id="tabs">
                        <button class="tab on" id="tab-topo">TOPO</button>
                        <button class="tab" id="tab-aerial">AERIAL</button>
                    </div>

                    <div class="collar-top">
                        <div class="ct-left">
                            <div class="c-kicker" id="c-kicker"></div>
                            <h1 class="c-title" id="c-title">Loading…</h1>
                            <div class="c-sub" id="c-sub"></div>
                            <div class="c-trip" id="c-trip"></div>
                        </div>
                        <div class="ct-right">
                            <a class="land-door" id="land-door" href="map.html" title="Back to the map — see this trail on the land">
                                <svg class="ld-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5l-7 7 7 7M6 12h13"/></svg>
                                <svg class="ld-map" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
                                <span>SEE ON<br>THE LAND</span>
                            </a>
                            <button class="full-btn" id="full-btn" title="Give the map the whole table (Esc to return)" aria-label="Expand the map">
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1H1v5M10 1h5v5M10 15h5v-5M6 15H1v-5"/></svg>
                            </button>
                            <div class="seal" id="seal"></div>
                        </div>
                    </div>

                    <!-- The vitals band: on an engraved sheet the measurements
                         belong in the title block, not the margin. -->
                    <div class="vitals" id="vitals"></div>

                    <div class="stage" id="stage">
                        <div class="glass-pane" id="sat-wrap"><div id="map-sat"></div></div>
                        <div class="glass-pane" id="topo-wrap"><div id="map-topo"></div></div>
                        <div class="split" id="split" role="separator" aria-label="Drag to sweep between the survey and the land"><div class="knob"></div></div>
                        <div class="side-label l" id="lab-l">THE SURVEY</div>
                        <div class="side-label r" id="lab-r">THE LAND</div>
                        <div class="corner nw" id="cnw"></div><div class="corner ne" id="cne"></div>
                        <div class="corner sw" id="csw"></div><div class="corner se" id="cse"></div>
                    </div>

                    <!-- The acetate is bolted to the sheet directly beneath the
                         map on purpose: scrubbing the day's shape must never
                         happen off-screen from the trail it describes. -->
                    <div class="acetate" id="acetate">
                        <div class="a-label"><span>THE SHAPE OF THE DAY</span></div>
                        <div id="shape-chart" class="shape-chart"></div>
                    </div>

                    <div class="collar-bottom">
                        <div class="legend">
                            <div class="l1" id="legend-1"></div>
                            <div class="l2" id="legend-2"></div>
                        </div>
                        <div class="scale-bar">
                            <div class="bar"><i></i><i></i><i></i><i></i></div>
                            <div class="t" id="scale-t"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- The paperwork -->
            <aside class="side" id="side-col">
                <div id="fire-memorial" class="fire-memorial" style="display:none;"></div>

                <section class="card ledger" id="almanac-section" style="display:none;">
                    <h2 class="k">Hike Almanac</h2>
                    <div class="alm-rows">
                        <div class="alm-row"><span class="lbl">Sunrise</span><span class="val" id="sunrise-time">--</span></div>
                        <div class="alm-note" id="sunrise-weather-desc"></div>
                        <div class="alm-row"><span class="lbl">Day's apex</span><span class="val" id="peak-weather-temp">--</span></div>
                        <div class="alm-note" id="peak-weather-desc"></div>
                        <div class="alm-row"><span class="lbl">Sunset</span><span class="val" id="sunset-time">--</span></div>
                        <div class="alm-note" id="sunset-weather-desc"></div>
                    </div>
                    <!-- Only when the GPX was a real recording (has a clock) -->
                    <div class="ontrail" id="ontrail-card" style="display:none;">
                        <div class="alm-row"><span class="lbl">On the trail</span><span class="val ontrail-times" id="ontrail-times">--</span></div>
                        <div class="ontrail-ribbon" id="ontrail-ribbon"><div class="ontrail-band" id="ontrail-band"></div></div>
                        <div class="alm-note" id="ontrail-duration"></div>
                    </div>
                </section>

                <section class="card pad" id="hike-description">
                    <h2 class="k">Trail Notes</h2>
                    <div id="description-content-container"></div>
                    <div id="external-links-container" class="links"></div>
                </section>

                <section class="card slip" id="flora-annotation" style="display:none;"></section>
                <section class="card slip" id="fauna-annotation" style="display:none;"></section>

                <section class="card logbook" id="hike-log" style="display:none;">
                    <h2 class="k">Logbook</h2>
                    <div id="logbook-container"></div>
                </section>
            </aside>
        </div>
    </main>

    <!-- The door back: appears only when the visitor stepped through from the
         map — it returns the land exactly as they left it (camera, moment,
         basemap, risen sheet) via the sessionStorage handshake. -->

    <!-- The lightbox: photos as gloriously as they deserve -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lb-close" id="modal-close-btn" title="Close" aria-label="Close">&times;</button>
        <button class="lb-btn lb-prev" id="modal-prev-btn" title="Previous" aria-label="Previous">&lsaquo;</button>
        <div class="lb-frame" id="lb-frame">
            <img id="modal-image" src="" alt="Full-size hike photo">
            <div id="modal-video-container" style="display:none;"></div>
            <div class="lb-plate">
                <span class="t" id="lb-title"></span>
                <span id="lb-count"></span>
            </div>
        </div>
        <button class="lb-btn lb-next" id="modal-next-btn" title="Next" aria-label="Next">&rsaquo;</button>
        <div class="lb-film" id="modal-dots-container"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Shared Atlas config + data layer (must load before other Atlas scripts) -->
    <script src="scripts/config.js"></script>
    <script src="scripts/atlas-data.js"></script>
    <!-- Shared trail renderer (formatHikeText) -->
    <script src="scripts/trail-renderer.js"></script>
    <!-- The Shape of the Day elevation profile -->
    <script src="scripts/shape-of-day.js"></script>
    <!-- The light table -->
    <script src="scripts/hike-detail.js"></script>
    <!-- Shared script to update the 'Logbook' nav link -->
    <script src="scripts/nav-updater.js"></script>
</body>
</html>
