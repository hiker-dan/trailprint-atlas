<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Crew - The Trailprint Atlas</title>
    <meta name="description" content="A Service Record from the Muster Roll — one companion's shared history with the Atlas, and every trail walked together.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Trailprint Atlas">
    <meta property="og:title" content="Trail Crew — The Trailprint Atlas">
    <meta property="og:description" content="A Service Record from the Muster Roll — every trail walked together.">
    <meta property="og:url" content="https://hiker-dan.github.io/trailprint-atlas/crew-member.html">
    <meta property="og:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_68-seal-lion-point-to-hidden-beach-loop-02">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trail Crew — The Trailprint Atlas">
    <meta name="twitter:description" content="A Service Record from the Muster Roll — every trail walked together.">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/crew.css"/>
</head>
<body>
    <!-- Shared nav: structure injected by scripts/nav.js (one copy for all pages) -->
    <nav id="top-bar-container"></nav>
    <script src="scripts/nav.js"></script>

    <!-- THE SERVICE RECORD — the same volume as crew.html, opened at one
         person's entry. Left leaf is the record, right leaf is the country
         walked together. The enlarged lane on the left is not decoration:
         it is the INDEX to the plates on the right, and the two are wired
         to each other in both directions. -->
    <div class="crew-book crew-record">

        <!-- the record -->
        <div class="leaf l">
            <div class="inner">
                <div class="rk">
                    <span id="sig-no">Signature</span>
                    <span>The Trailprint Atlas</span>
                </div>
                <h1 class="rec-name" id="member-name">&nbsp;</h1>
                <div class="bk-rule"></div>

                <div class="plate-photo" id="member-portrait"></div>
                <div class="svc" id="member-service"></div>

                <div class="lane-block" id="member-lane-block">
                    <div class="lane-hd">
                        <span class="t">Every outing together</span>
                        <span class="c">hover a mark</span>
                    </div>
                    <!-- The lane: one instrument, two kinds of mark. A chapter
                         or an outing stands inked above the register rule; the
                         rest of the Atlas runs quietly along it. Past five
                         years it wraps onto a second course. -->
                    <div class="big-lane" id="member-lane"></div>
                    <!-- The chapters panel. Empty here on purpose: it has three
                         states and crew-member.js measures every one of them to
                         reserve a height that never moves. -->
                    <div class="readout rest" id="member-readout"></div>
                </div>

                <!-- the way back is the same door in reverse: base.css's
                     .atlas-door, mirrored, naming the destination -->
                <div class="rec-back">
                    <a class="atlas-door is-wide is-return" id="member-back" href="crew.html">
                        <svg class="ad-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>
                        <span class="ad-copy">
                            <span class="ad-main">THE MUSTER ROLL</span>
                            <span class="ad-sub">Back to the book</span>
                        </span>
                        <svg class="ad-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3.5" y="4" width="17" height="16" rx="1.5"/>
                            <path d="M7 8.5h10M7 12h10M7 15.5h6"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div class="gutter"></div>

        <!-- the plates -->
        <div class="leaf r">
            <div class="inner">
                <div class="rec-head">
                    <span class="t">The country walked together</span>
                    <span class="n" id="member-platecount"></span>
                </div>
                <div class="sheets" id="member-sheets">
                    <div class="plates" id="member-plates"></div>
                    <div class="loose" id="member-loose" hidden>
                        <div class="p-collar">
                            <span class="p-name">Loose sheet</span>
                            <span class="p-cnt" id="member-loose-count"></span>
                        </div>
                        <div class="prints" id="member-prints"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Shared Atlas config + data layer (must load before other Atlas scripts) -->
    <script src="scripts/config.js"></script>
    <script src="scripts/atlas-data.js"></script>
    <!-- The page turn: the gesture shared with crew.html -->
    <script src="scripts/crew-book.js"></script>
    <!-- This page's script -->
    <script src="scripts/crew-member.js"></script>
    <!-- Shared script: active-page highlight (+ the credits slideshow) -->
    <script src="scripts/nav-updater.js"></script>
</body>
</html>
