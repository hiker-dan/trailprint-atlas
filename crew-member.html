<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Crew - The Trailprint Atlas</title>
    <meta name="description" content="One member of the Trail Crew — every trail shared, mapped and listed.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Trailprint Atlas">
    <meta property="og:title" content="Trail Crew — The Trailprint Atlas">
    <meta property="og:description" content="One member of the Trail Crew — every trail shared, mapped and listed.">
    <meta property="og:url" content="https://hiker-dan.github.io/trailprint-atlas/crew-member.html">
    <meta property="og:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_68-seal-lion-point-to-hidden-beach-loop-02">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trail Crew — The Trailprint Atlas">
    <meta name="twitter:description" content="One member of the Trail Crew — every trail shared, mapped and listed.">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/crew.css"/>
</head>
<body>
    <!-- Shared nav: structure injected by scripts/nav.js (one copy for all pages) -->
    <nav id="top-bar-container"></nav>
    <script src="scripts/nav.js"></script>

    <!-- Member hero: name + the shared story in numbers -->
    <div id="crew-hero">
        <p id="crew-eyebrow">Trail Crew</p>
        <h1 id="member-name">Loading...</h1>
        <p id="member-statline"></p>
        <p id="member-since"></p>
    </div>

    <div class="crew-container">
        <a class="member-back" href="crew.html">&larr; Back to the Trail Crew</a>

        <!-- Every shared trail, as atlas plates: one mini-map per region so
             the trails are legible at a glance, plus a "Scattered Trails"
             row of line-art trailprints for the far-flung one-offs. -->
        <div class="info-section">
            <h3>Trails We've Shared</h3>
            <div id="member-plates" class="plates-grid"></div>
            <div id="member-scattered" class="plate scattered-plate" style="display: none;">
                <div class="plate-title">
                    <span class="plate-name">Scattered Trails</span>
                    <span class="plate-count" id="scattered-count"></span>
                </div>
                <div id="member-prints" class="trailprints"></div>
            </div>
        </div>

        <!-- The full shared history, newest first -->
        <div class="info-section">
            <h3>Every Hike Together</h3>
            <div id="member-hikes"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Shared Atlas config + data layer (must load before other Atlas scripts) -->
    <script src="scripts/config.js"></script>
    <script src="scripts/atlas-data.js"></script>
    <!-- This page's script -->
    <script src="scripts/crew-member.js"></script>
    <!-- Shared script: active-page highlight (+ the credits slideshow) -->
    <script src="scripts/nav-updater.js"></script>
</body>
</html>
