<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map - The Trailprint Atlas</title>
    <meta name="description" content="Every hike on one interactive map — filter by year, hike type, difficulty, and company.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <!-- Link preview cards (Open Graph + Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Trailprint Atlas">
    <meta property="og:title" content="Interactive Map — The Trailprint Atlas">
    <meta property="og:description" content="Every hike on one interactive map — filter by year, hike type, difficulty, and company.">
    <meta property="og:url" content="https://hiker-dan.github.io/trailprint-atlas/map.html">
    <meta property="og:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_58-heather-lakes-via-lakes-trail-01">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Interactive Map — The Trailprint Atlas">
    <meta name="twitter:description" content="Every hike on one interactive map — filter by year, hike type, difficulty, and company.">
    <meta name="twitter:image" content="https://res.cloudinary.com/dgdniwosl/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/tta_58-heather-lakes-via-lakes-trail-01">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/map.css"/>
</head>
<body>
    <!-- Shared nav: structure injected by scripts/nav.js (one copy for all pages) -->
    <nav id="top-bar-container"></nav>
    <script src="scripts/nav.js"></script>
    <h1 class="map-page-title">The Interactive Map</h1>
    <p class="map-page-subtitle">Explore every hike, filter by your criteria, and click on any trail to see the details.</p>

    <div class="content-wrapper">
        <div id="trail-list-panel">
            <div id="trail-list-header">
                <h2>Trails</h2>
                <div id="trail-search-container"><input type="search" id="trail-search-input" placeholder="Search trails by name..."></div>
            </div>
            <div id="trail-list-container"></div>
        </div>
        <div id="map"></div>
    </div>

    <div id="legend-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
   integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
   crossorigin=""></script>

   <!-- Shared Atlas config + data layer (must load before other Atlas scripts) -->
   <script src="scripts/config.js"></script>
   <script src="scripts/atlas-data.js"></script>

   <!-- Our new shared trail renderer -->
   <script src="scripts/trail-renderer.js"></script>

   <!-- Our custom map script -->
   <script src="scripts/map.js"></script>

   <!-- Shared script to update the 'Latest Hike' nav link -->
   <script src="scripts/nav-updater.js"></script>
</body>
</html>
